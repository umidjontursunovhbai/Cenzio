[project]
name = "smartspend-mcp"
version = "0.1.0"
description = "Local, owner-scoped SmartSpend MCP with reviewable iPhone exchange"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.22,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
smartspend-mcp = "smartspend_mcp.cli:main"
smartspend-ai = "smartspend_mcp.ai_cli:main"
smartspend-voice = "smartspend_mcp.voice_api:main"
smartspend-sync = "smartspend_mcp.sync_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartspend_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
